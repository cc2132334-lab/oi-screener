name: Update Market Data

on:
  schedule:
    # Monday to Friday market hours (IST 9:15 AM - 3:30 PM) + 9:25 AM exact run
    - cron: '*/15 3-10 * * 1-5'
    - cron: '55 3 * * 1-5'
  workflow_dispatch: # Manual run button

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history fetch for clean git pull/rebase

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Market Screener
        run: |
          python fetch_data.py

      - name: Save and Commit Data to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto updated market data"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in data.json to commit."
          fi
